server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 에셋 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅(react-router) 대응: 없는 경로는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
